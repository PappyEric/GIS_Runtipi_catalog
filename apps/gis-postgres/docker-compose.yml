services:
  gis-postgres:
    image: postgis/postgis:16-3.4
    environment:
      PGPORT: "5433"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/postgresql/data
    x-runtipi:
      is_main: true
      internal_port: 5433
      add_to_main_network: true
x-runtipi:
  schema_version: 2
  overrides: []
