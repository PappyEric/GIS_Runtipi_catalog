services:
  mergin-maps-redis:
    image: redis:alpine
    x-runtipi:
      add_to_main_network: true

  mergin-maps:
    image: lutraconsulting/merginmaps-backend:2025.7.3
    entrypoint:
      - "/bin/bash"
      - "-c"
      - |
        set -e
        echo "=== Step 1: Run first migration branch ==="
        flask --app application db upgrade b9ec9ab6694f || true

        echo "=== Step 2: Resolve Community Branch Data Migration ==="
        python3 -c "
        import psycopg2, os
        conn = psycopg2.connect(
            host=os.environ['DB_HOST'],
            port=os.environ['DB_PORT'],
            user=os.environ['DB_USER'],
            password=os.environ['DB_PASSWORD'],
            database=os.environ['DB_DATABASE']
        )
        cur = conn.cursor()
        cur.execute(\"INSERT INTO alembic_version (version_num) VALUES ('35af0c8be41e') ON CONFLICT DO NOTHING\")
        conn.commit()
        conn.close()
        print('Community branch stamped.')
        "

        echo "=== Step 3: Complete remaining database migrations ==="
        flask --app application db upgrade

        echo "=== Step 4: Initialize workspace ==="
        flask --app application init || true

        echo "=== Step 5: Create admin user ==="
        flask --app application user create "${ADMIN_USER}" "${ADMIN_PASSWORD}" --is-admin --email "${ADMIN_EMAIL}" || true

        echo "=== Step 6: Start gunicorn ==="
        exec gunicorn -w 4 -b 0.0.0.0:5000 --config config.py application:application
    depends_on:
      - mergin-maps-redis
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CELERY_BROKER_URL: "redis://mergin-maps-redis:6379/0"
      MERGIN_BASE_URL: ${MERGIN_BASE_URL}
      GLOBAL_WORKSPACE: ${GLOBAL_WORKSPACE}
      LOCAL_PROJECTS: /data
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_BEARER_SALT: ${SECURITY_BEARER_SALT}
      SECURITY_EMAIL_SALT: ${SECURITY_EMAIL_SALT}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      add_to_main_network: true

  mergin-maps-worker:
    image: lutraconsulting/merginmaps-backend:2025.7.3
    entrypoint: ["/bin/bash", "-c", "umask 0027 && celery -A application.celery worker --loglevel=info"]
    depends_on:
      - mergin-maps-redis
      - mergin-maps
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CELERY_BROKER_URL: "redis://mergin-maps-redis:6379/0"
      MERGIN_BASE_URL: ${MERGIN_BASE_URL}
      GLOBAL_WORKSPACE: ${GLOBAL_WORKSPACE}
      LOCAL_PROJECTS: /data
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_BEARER_SALT: ${SECURITY_BEARER_SALT}
      SECURITY_EMAIL_SALT: ${SECURITY_EMAIL_SALT}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      add_to_main_network: true

  mergin-maps-beat:
    image: lutraconsulting/merginmaps-backend:2025.7.3
    entrypoint: ["/bin/bash", "-c", "umask 0027 && celery -A application.celery beat --loglevel=info"]
    depends_on:
      - mergin-maps-redis
      - mergin-maps
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CELERY_BROKER_URL: "redis://mergin-maps-redis:6379/0"
      MERGIN_BASE_URL: ${MERGIN_BASE_URL}
      GLOBAL_WORKSPACE: ${GLOBAL_WORKSPACE}
      LOCAL_PROJECTS: /data
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_BEARER_SALT: ${SECURITY_BEARER_SALT}
      SECURITY_EMAIL_SALT: ${SECURITY_EMAIL_SALT}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      add_to_main_network: true

  mergin-maps-web:
    image: lutraconsulting/merginmaps-frontend:2025.7.3
    depends_on:
      - mergin-maps
    x-runtipi:
      add_to_main_network: true

  mergin-maps-proxy:
    image: nginxinc/nginx-unprivileged:1.27
    restart: always
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mergin-maps
      - mergin-maps-web
    x-runtipi:
      is_main: true
      internal_port: 8080
      add_to_main_network: true

x-runtipi:
  schema_version: 2
  overrides: []
