services:
  mergin-maps:
    image: merginmaps/server:latest
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: "5433"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: "gis"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      is_main: true
      internal_port: 80
      add_to_main_network: true
x-runtipi:
  schema_version: 2
  overrides: []
