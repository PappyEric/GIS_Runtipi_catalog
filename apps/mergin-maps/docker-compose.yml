services:
  mergin-maps-redis:
    image: redis:alpine
    x-runtipi:
      add_to_main_network: true

  mergin-maps:
    image: lutraconsulting/merginmaps-backend:2025.7.3
    entrypoint: ["/bin/bash", "-c", "umask 0027 && flask --app application db upgrade heads && (flask --app application user create \"${ADMIN_USER}\" \"${ADMIN_PASSWORD}\" --is-admin --email \"${ADMIN_EMAIL}\" || true) && gunicorn -w 4 -b 0.0.0.0:5000 --config config.py application:application"]
    depends_on:
      - mergin-maps-redis
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CELERY_BROKER_URL: "redis://mergin-maps-redis:6379/0"
      MERGIN_BASE_URL: ${MERGIN_BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_BEARER_SALT: ${SECURITY_BEARER_SALT}
      SECURITY_EMAIL_SALT: ${SECURITY_EMAIL_SALT}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      add_to_main_network: true

  mergin-maps-worker:
    image: lutraconsulting/merginmaps-backend:2025.7.3
    entrypoint: ["/bin/bash", "-c", "umask 0027 && celery -A application.celery worker --loglevel=info"]
    depends_on:
      - mergin-maps-redis
      - mergin-maps
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CELERY_BROKER_URL: "redis://mergin-maps-redis:6379/0"
      MERGIN_BASE_URL: ${MERGIN_BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_BEARER_SALT: ${SECURITY_BEARER_SALT}
      SECURITY_EMAIL_SALT: ${SECURITY_EMAIL_SALT}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      add_to_main_network: true

  mergin-maps-beat:
    image: lutraconsulting/merginmaps-backend:2025.7.3
    entrypoint: ["/bin/bash", "-c", "umask 0027 && celery -A application.celery beat --loglevel=info"]
    depends_on:
      - mergin-maps-redis
      - mergin-maps
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CELERY_BROKER_URL: "redis://mergin-maps-redis:6379/0"
      MERGIN_BASE_URL: ${MERGIN_BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_BEARER_SALT: ${SECURITY_BEARER_SALT}
      SECURITY_EMAIL_SALT: ${SECURITY_EMAIL_SALT}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      add_to_main_network: true

  mergin-maps-web:
    image: lutraconsulting/merginmaps-frontend:2025.7.3
    depends_on:
      - mergin-maps
    x-runtipi:
      add_to_main_network: true

  mergin-maps-proxy:
    image: nginxinc/nginx-unprivileged:1.27
    restart: always
    command: /bin/sh -c "echo '' | base64 -d > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - mergin-maps
      - mergin-maps-web
    x-runtipi:
      is_main: true
      internal_port: 8080
      add_to_main_network: true
x-runtipi:
  schema_version: 2
  overrides: []
