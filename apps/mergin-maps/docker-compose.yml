services:
  mergin-maps:
    image: merginmaps/server:latest
    environment:
      DB_host: ${DB_HOST}
      DB_port: "5433"
      DB_user: ${DB_USER}
      DB_pass: ${DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      is_main: true
      internal_port: 80
      add_to_main_network: true
x-runtipi:
  schema_version: 2
  overrides: []
