services:
  lizmap-init:
    image: alpine:latest
    command: sh -c 'mkdir -p /srv/plugins /www/lizmap/var/db /www/lizmap/var/config
      /www/lizmap/var/log /www/lizmap/www; if [ ! -f
      /srv/plugins/lizmap_server/metadata.txt ]; then echo "Installing Lizmap
      server plugin..."; apk add --no-cache wget unzip; wget -q -O
      /tmp/plugin.zip
      https://github.com/3liz/qgis-lizmap-server-plugin/archive/refs/heads/master.zip;
      unzip -o /tmp/plugin.zip -d /tmp/; rm -rf /srv/plugins/lizmap_server; mv
      /tmp/qgis-lizmap-server-plugin-master /srv/plugins/lizmap_server; fi;
      chown -R 1000:1000 /srv/plugins /www/lizmap/var /www/lizmap/www; chmod -R
      775 /srv/plugins /www/lizmap/var; echo "Init complete, sleeping..."; sleep
      infinity'
    volumes:
      - ${APP_DATA_DIR}/var/db:/www/lizmap/var/db
      - ${APP_DATA_DIR}/var/config:/www/lizmap/var/config
      - ${APP_DATA_DIR}/var/log:/www/lizmap/var/log
      - ${APP_DATA_DIR}/www:/www/lizmap/www
      - ${APP_DATA_DIR}/plugins:/srv/plugins
  nginx:
    image: nginx:alpine
    command: /bin/sh -c "echo
      ''
      | base64 -d > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    volumes:
      - ${APP_DATA_DIR}/www:/www/lizmap/www
    depends_on:
      - lizmap
    x-runtipi:
      is_main: true
      internal_port: 80
  lizmap:
    image: 3liz/lizmap-web-client:3.9
    environment:
      LIZMAP_WMSSERVERURL: http://qgis-server:8080/ows/
      LIZMAP_CACHERREDISHOST: redis
      LIZMAP_CACHESTORAGETYPE: redis
      LIZMAP_CACHEREDISDB: "1"
      LIZMAP_HOME: /www/lizmap
      LIZMAP_USER: "1000"
      LIZMAP_GID: "1000"
    volumes:
      - ${APP_DATA_DIR}/projects:/srv/projects
      - ${APP_DATA_DIR}/www:/www/lizmap/www
      - ${APP_DATA_DIR}/var/db:/www/lizmap/var/db
      - ${APP_DATA_DIR}/var/config:/www/lizmap/var/config
      - ${APP_DATA_DIR}/var/log:/www/lizmap/var/log
    depends_on:
      - qgis-server
      - redis
      - lizmap-init
    x-runtipi:
      add_to_main_network: true
  qgis-server:
    image: 3liz/qgis-map-server:ltr
    environment:
      QGSRV_SERVER_WORKERS: "4"
      QGSRV_LOGGING_LEVEL: DEBUG
      QGIS_SERVER_LIZMAP_REVEAL_SETTINGS: "true"
      QGSRV_API_ENABLED_LIZMAP: "true"
      QGSRV_SERVER_PLUGINPATH: /srv/plugins
      QGIS_PLUGINPATH: /srv/plugins
      QGSRV_CACHE_ROOTDIR: /srv/projects
      QGSRV_USER: 1000:1000
    volumes:
      - ${APP_DATA_DIR}/projects:/srv/projects
      - ${APP_DATA_DIR}/plugins:/srv/plugins
    depends_on:
      - lizmap-init
    x-runtipi:
      add_to_main_network: true
  redis:
    image: redis:alpine
x-runtipi:
  schema_version: 2
  overrides: []
