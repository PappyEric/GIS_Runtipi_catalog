services:
  nginx:
    image: geonode/nginx:4.2.0
    environment:
      RESOLVER: 127.0.0.11
    depends_on:
      - django
      - geoserver
    x-runtipi:
      is_main: true
      internal_port: 80
  django:
    image: geonode/geonode:4.2.0
    environment:
      GEONODE_INSTANCE_NAME: geonode
      GEONODE_LB_HOST_IP: ${GEONODE_LB_HOST_IP}
      GEONODE_LB_PORT: "80"
      SITEURL: http://${GEONODE_LB_HOST_IP}/
      DATABASE_URL: postgis://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5433/geonode
      GEODATABASE_URL: postgis://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5433/geonode_data
      GEOSERVER_WEB_UI_LOCATION: http://geoserver:8080/geoserver/
      GEOSERVER_PUBLIC_LOCATION: http://${GEONODE_LB_HOST_IP}/geoserver/
      BROKER_URL: redis://redis:6379/1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: admin@example.com
      C_FORCE_ROOT: "True"
    depends_on:
      - redis
    x-runtipi:
      add_to_main_network: true
  geoserver:
    image: geonode/geoserver:2.23.0
    environment:
      GEONODE_LB_HOST_IP: ${GEONODE_LB_HOST_IP}
      GEONODE_LB_PORT: "80"
      NGINX_BASE_URL: http://${GEONODE_LB_HOST_IP}/
    depends_on:
      - django
  redis:
    image: redis:7-alpine
  celery:
    image: geonode/geonode:4.2.0
    command: celery-cmd
    environment:
      DATABASE_URL: postgis://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5433/geonode
      GEODATABASE_URL: postgis://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5433/geonode_data
      BROKER_URL: redis://redis:6379/1
      C_FORCE_ROOT: "True"
    depends_on:
      - redis
    x-runtipi:
      add_to_main_network: true
x-runtipi:
  schema_version: 2
  overrides: []
