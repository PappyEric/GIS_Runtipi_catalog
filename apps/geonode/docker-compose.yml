services:
  nginx:
    image: geonode/nginx:latest
    environment:
      RESOLVER: 127.0.0.11
    depends_on:
      - django
      - geoserver
    x-runtipi:
      is_main: true
      internal_port: 80

  django:
    image: geonode/geonode:latest-ubuntu-24.04
    environment:
      GEONODE_INSTANCE_NAME: geonode
      GEONODE_LB_HOST_IP: ${GEONODE_LB_HOST_IP}
      GEONODE_LB_PORT: "80"
      SITEURL: http://${GEONODE_LB_HOST_IP}/
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GEOSERVER_WEB_UI_LOCATION: http://geoserver:8080/geoserver/
      GEOSERVER_PUBLIC_LOCATION: http://${GEONODE_LB_HOST_IP}/geoserver/
      BROKER_URL: redis://redis:6379/1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: admin@example.com
      C_FORCE_ROOT: "True"
    entrypoint:
      - "python3"
      - "-c"
      - |
        import os, urllib.parse
        pw = urllib.parse.quote_plus(os.environ["DB_PASSWORD"])
        os.environ["DATABASE_URL"] = f"postgis://{os.environ['DB_USER']}:{pw}@{os.environ['DB_HOST']}:{os.environ['DB_PORT']}/geonode"
        os.environ["GEODATABASE_URL"] = f"postgis://{os.environ['DB_USER']}:{pw}@{os.environ['DB_HOST']}:{os.environ['DB_PORT']}/geonode_data"
        os.execvp("/usr/src/geonode/entrypoint.sh", ["/usr/src/geonode/entrypoint.sh", "uwsgi", "--ini", "/usr/src/geonode/uwsgi.ini"])
    depends_on:
      - redis
    x-runtipi:
      add_to_main_network: true

  geoserver:
    image: geonode/geoserver:2.27.5-latest
    environment:
      GEONODE_LB_HOST_IP: ${GEONODE_LB_HOST_IP}
      GEONODE_LB_PORT: "80"
      NGINX_BASE_URL: http://${GEONODE_LB_HOST_IP}/
    depends_on:
      - django

  redis:
    image: redis:7-alpine

  celery:
    image: geonode/geonode:latest-ubuntu-24.04
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BROKER_URL: redis://redis:6379/1
      C_FORCE_ROOT: "True"
    entrypoint:
      - "python3"
      - "-c"
      - |
        import os, urllib.parse
        pw = urllib.parse.quote_plus(os.environ["DB_PASSWORD"])
        os.environ["DATABASE_URL"] = f"postgis://{os.environ['DB_USER']}:{pw}@{os.environ['DB_HOST']}:{os.environ['DB_PORT']}/geonode"
        os.environ["GEODATABASE_URL"] = f"postgis://{os.environ['DB_USER']}:{pw}@{os.environ['DB_HOST']}:{os.environ['DB_PORT']}/geonode_data"
        os.execvp("/usr/src/geonode/entrypoint.sh", ["/usr/src/geonode/entrypoint.sh", "celery-cmd"])
    depends_on:
      - redis
    x-runtipi:
      add_to_main_network: true

x-runtipi:
  schema_version: 2
  overrides: []
